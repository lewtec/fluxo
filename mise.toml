[tools]
go = "1.26.5"
node = "24"
goreleaser = "2.18.0"
svu = "3.3.0"

[tasks.generate]
description = "Run go generate"
run = "go generate ./..."

[tasks.web]
description = "Compile Tailwind CSS and generate templ"
depends = ["generate"]
run = "npm --prefix web ci && npm --prefix web run build"

[tasks.install]
description = "Download Go module deps"
run = "go mod download"

[tasks.fmt]
description = "Format Go packages"
depends = ["generate"]
run = "go fmt ./..."

[tasks.lint]
description = "Run go vet"
run = "go vet ./..."

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks.build]
description = "Build fluxo (embeds web/dist)"
depends = ["web"]
run = "go build -o fluxo ./cmd/fluxo"

[tasks.ci]
description = "Generate, format, vet, test, build"
depends = ["web", "fmt", "lint", "test", "build"]

[tasks."release:check"]
description = "Validate .goreleaser.yaml"
run = "goreleaser check"

[tasks.release]
description = "Tag and release with GoReleaser (svu + goreleaser)"
depends = ["ci"]
usage = '''
arg "<version>" help="New version" {
  choices "next" "major" "minor" "patch"
  default "next"
}
'''
run = '''
TAG="$(svu ${usage_version})"
echo "Releasing tag: $TAG (svu current=$(svu current 2>/dev/null || echo none))"
if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
  echo "Tag $TAG already exists" >&2
  exit 1
fi
git tag "$TAG"
if ! goreleaser release --clean; then
  git tag -d "$TAG"
  exit 1
fi
'''
